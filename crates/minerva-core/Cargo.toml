[package]
name = "minerva-core"
version = "0.16.0"
description = "Headless Minerva core: captures of the game in, panel state out. No OS or UI dependencies."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
# Reads OSMS Data Explorer's files and MeowDB's search answers.
serde_json = { workspace = true }
# PNG for the crops a Bug Report keeps.
image = { workspace = true, features = ["png"] }
# A Bug Report is a .zip, and its trace is held compressed meanwhile (ADR 0009).
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# ocrs 0.13.1 needs rten 0.26 (it does not accept 0.27).
ocrs = { version = "0.13.1", default-features = false, features = ["onnx"] }
rten = "0.26"
rten-imageproc = "0.26"
