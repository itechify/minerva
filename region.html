<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark a region</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
        /* Not fully transparent, so every pixel takes the mouse. A navy veil, so the
           game reads as paused behind it. */
        background: rgba(18, 28, 56, 0.3);
        font: 14px/20px var(--font);
      }
      /* A small game window with what to do. */
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 64px);
        box-sizing: border-box;
        padding: 9px 14px 10px;
        border: 1px solid var(--frame);
        border-radius: 6px;
        background: var(--body);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
        color: var(--ink);
        text-align: center;
        pointer-events: none;
        outline: none;
      }

      .hint h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 700;
      }
      .hint p {
        margin: 2px 0;
        color: var(--ink-2);
        font-size: 13px;
      }
      .hint output {
        display: block;
        margin-top: 6px;
        color: var(--ink-3);
        font-size: 12px;
      }
      /* The box being marked: the system's dashed edit blue over a solid white band,
         so it shows on the minimap's light blue and on dark scenery alike. Clear inside,
         so what it frames reads at full strength. */
      .box {
        position: fixed;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.95);
        outline: 2px dashed var(--edit);
        outline-offset: -2px;
        background: none;
        pointer-events: none;
      }
      [hidden] {
        display: none;
      }
    </style>
    <script type="module" src="/src/region.ts" defer></script>
  </head>
  <body>
    <main class="hint" id="marking-hint" tabindex="-1" aria-labelledby="marking-title">
      <h1 id="marking-title">Mark both lines of the minimap title</h1>
      <p>Drag a box, or use Arrow keys to move · Alt+Arrow to resize · Shift for larger steps</p>
      <p>Enter to test · Esc to cancel</p>
      <output id="selection-status" role="status" aria-atomic="true"></output>
    </main>
    <div class="box" id="box" hidden></div>
  </body>
</html>
