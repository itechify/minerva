# Builds the Minerva site and tests its Worker on a pull request that could change them, and on
# main (docs/releasing.md reads main's check), so a broken build shows before a release would publish it. The build fails while a screenshot the page shows
# hasn't been taken (site/screenshots/README.md).
name: Site check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - site/**
      - src/theme.css
      # The Map Leaderboards' lanes are the Personal Bests window's.
      - src/lane.css
      - src/hotkeys.ts
      # The pages draw with the app's small DOM helpers.
      - src/dom.ts
      # The Map Leaderboards pages write figures and dates as the app does, and name maps
      # from the map names fixture.
      - src/figures.ts
      - src/dates.ts
      - crates/minerva-core/tests/fixtures/osms-map-names.json
      - assets/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/site*.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      # The Map Leaderboards API (site/worker), type-checked and tested against a local D1, and
      # what the Map Leaderboards pages show (site/leaderboards). An uncaught exception in workerd
      # fails the step even when every test passes: it is something a test let out of its
      # made-up world, such as a fetch to the real network (test/discord-webhook.ts).
      - name: pnpm site:test
        shell: bash
        run: |
          set -o pipefail
          pnpm site:test 2>&1 | tee "$RUNNER_TEMP/site-test.log"
          if grep -q "uncaught exception" "$RUNNER_TEMP/site-test.log"; then
            echo "::error::pnpm site:test printed $(grep -c "uncaught exception" "$RUNNER_TEMP/site-test.log") uncaught exception line(s); see the log above."
            exit 1
          fi
