<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/grind-tracker.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grind Tracker</title>
    <script type="module" src="/src/grind-tracker.ts"></script>
  </head>
  <body class="draggable hidden">
    <main class="panel" id="panel">
      <div class="view">
        <header class="window-bar drag-handle">
          <img class="window-icon" src="/assets/grind-tracker.png" alt="" draggable="false" />
          <p class="window-name">Grind Tracker</p>
          <div class="toolbar" role="toolbar" aria-label="Grind Tracker window">
            <!-- Every map's Personal Best, in a window of their own; only once some map has one.
                 The star is the Best row's own mark for a best, outlined as the bar's icons are,
                 and stays pressed while that window is open. -->
            <button type="button" class="icon-button" id="open-bests" data-control="togglePersonalBests" aria-label="Your Personal Bests on every map" title="Your Personal Bests on every map" aria-pressed="false" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.68L9.48 6.52L13.59 6.75L10.39 9.34L11.45 13.32L8 11.08L4.55 13.32L5.61 9.34L2.41 6.75L6.52 6.52Z" /></svg>
            </button>
            <button type="button" class="icon-button" data-control="closeGrindTracker" aria-label="Close the Grind Tracker" title="Close the Grind Tracker (the Session carries on)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
            </button>
          </div>
        </header>
        <section class="tracking" id="tracking" aria-label="Session">
          <div class="notes" aria-live="polite">
            <p class="note problem" id="tracking-unreadable" hidden>Can't read the EXP bar. Move whatever covers it.</p>
            <p class="note" id="tracking-switched" hidden>You switched character, so this is a new Session.</p>
            <p class="note undo" id="tracking-reset" hidden>
              <span>Session reset.</span>
              <button type="button" class="text-button" data-control="undoReset">Undo</button>
            </p>
            <p class="note" id="tracking-waiting">Waiting for EXP</p>
          </div>
          <div class="figures" id="tracking-figures" hidden>
            <div class="headline" id="tracking-headline">
              <p class="headline-text">
                <span class="label">Time to Level</span>
                <span class="time-to-level" id="time-to-level"></span>
                <span class="tag paused" id="tracking-tag" hidden>paused</span>
              </p>
              <button type="button" class="icon-button light" data-control="resetSession" aria-label="Reset the Session" title="Reset the Session: measure EXP afresh from your next gain">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 6.2A5 5 0 1 1 3 9.5M2.8 2.8v3.6h3.6" /></svg>
              </button>
            </div>
            <!-- The Best row is the map's Personal Best as it stands, from arriving on the
                 map: until the Session starts it is all the figures hold. Once this Visit
                 beats it, it is this Visit's, and says so. The star marks Last 5 min while it
                 is that best. -->
            <div class="rates">
              <div class="row" id="rolling-row">
                <span class="period">Last 5 min<svg class="star" id="rolling-star" viewBox="0 0 16 16" role="img" aria-label="New best on this map"><title>New best on this map</title><path d="M8 1.5L9.76 6.07L14.66 6.34L10.85 9.43L12.11 14.16L8 11.5L3.89 14.16L5.15 9.43L1.34 6.34L6.24 6.07Z" /><ellipse class="lit" cx="7.1" cy="6.9" rx="1.5" ry="1.1" /></svg></span>
                <span class="value" id="rolling-exp"></span><span class="unit">EXP/h</span>
                <span class="value" id="rolling-percent"></span><span class="unit per">/h</span>
              </div>
              <div class="row" id="session-row" hidden>
                <span class="period">Session <span class="length" id="session-length"></span></span>
                <span class="value" id="session-exp"></span><span class="unit">EXP/h</span>
                <span class="value" id="session-percent"></span><span class="unit per">/h</span>
              </div>
              <div class="row best" id="best-row" hidden>
                <!-- "Best" opens the Personal Bests window too, where the player meets their bests. -->
                <span class="period"><button type="button" class="best-link" data-control="togglePersonalBests" title="Your Personal Bests on every map">Best</button> <span class="length" id="best-this-visit" hidden>this visit</span><svg class="party-mark" id="best-party" viewBox="0 0 16 16" role="img" aria-label="Your Party Best" hidden><title>Your Party Best: Party EXP is in your last 5 minutes</title><circle cx="5.5" cy="5.5" r="2.2" /><circle cx="11" cy="6.5" r="1.8" /><path d="M1.5 13c0-2.6 1.8-4.3 4-4.3s4 1.7 4 4.3M9.5 12.4c.3-1.7 1.4-2.8 2.9-2.8 1.6 0 2.6 1.1 2.6 2.8" /></svg></span>
                <span class="value" id="best-exp"></span><span class="unit">EXP/h</span>
                <button type="button" class="icon-button light" data-control="removeBest" aria-label="Remove this best" title="Remove this best: your next best takes its place">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
                </button>
              </div>
            </div>
            <!-- The Pace Trace: the last 5 minutes of play up to the last EXP gain, raced
                 against the 5 minutes before them, as split times against a ghost. The flat
                 line is the earlier pace, and the trace how far ahead of it (or behind) the
                 player is, falling back as the earlier pace runs on and stepping up at each
                 gain. Once the Best row's pace is within reach on the map, it joins as a
                 rising line ending in a best's star, and the lead over it is lit in You
                 Yellow. The player's dot is where they stand now. It moves only as the EXP
                 does. -->
            <svg class="pace" id="pace" role="img" aria-labelledby="pace-name" hidden>
              <title id="pace-name"></title>
              <defs>
                <!-- The minimap's dot for the player, lit up and to the left. -->
                <radialGradient id="pace-you-light" cx="0.35" cy="0.3" r="0.95">
                  <stop offset="0.18" style="stop-color: var(--you-light)" />
                  <stop offset="0.45" style="stop-color: var(--you)" />
                </radialGradient>
                <!-- Above the Best's pace line: the lead over it. -->
                <clipPath id="pace-ahead"><path id="pace-ahead-path" /></clipPath>
              </defs>
              <path class="area" id="pace-area" />
              <path class="lead" id="pace-lead" clip-path="url(#pace-ahead)" />
              <line class="arrived" id="pace-arrived" />
              <line class="earlier" id="pace-earlier" />
              <line class="best" id="pace-best" />
              <path class="trace" id="pace-trace" />
              <!-- A best's star, as on the Last 5 min row, where the Best's pace has got to. -->
              <path class="best-mark" id="pace-best-mark" d="M8 1.5L9.76 6.07L14.66 6.34L10.85 9.43L12.11 14.16L8 11.5L3.89 14.16L5.15 9.43L1.34 6.34L6.24 6.07Z" />
              <text class="name" id="pace-earlier-name">Earlier</text>
              <text class="split" id="pace-split"></text>
              <circle class="you" id="pace-you" r="3.5" />
            </svg>
            <p class="line" id="tracking-deaths" hidden></p>
            <!-- The Loot, under the EXP figures and the Pace Trace so EXP stays together: the
                 mesos and Items the Pickup Log says the Session has picked up. Collapsed to its
                 header at first, with the Session's totals on it; open, the Mesos row and then
                 the Items. It stays as the player left it across launches. -->
            <div class="loot" id="loot" hidden>
              <button type="button" class="loot-head" id="loot-head" data-control="toggleLoot" aria-expanded="false" aria-controls="loot-body">
                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l5 5-5 5" /></svg>
                <span class="label">Loot</span>
                <span class="count" id="loot-count"></span>
              </button>
              <div id="loot-body" hidden>
                <div class="rates" id="meso-rates">
                  <!-- The mesos the Pickup Log says the Session has picked up, and mesos an hour,
                       laid out as the rows above are but without their units: the label says what
                       the first figure is, the "/h" what the second. -->
                  <div class="row" id="meso-row">
                    <span class="period">Mesos</span>
                    <span class="value" id="meso-total"></span><span class="unit"></span>
                    <span class="value" id="meso-rate"></span><span class="unit per">/h</span>
                  </div>
                </div>
                <!-- The Items: the 5 picked up most, each with its count, and "+N more" for the
                     rest. No rate: Items aren't per hour. -->
                <ul class="loot-items" id="loot-items" hidden></ul>
                <button type="button" class="loot-more" id="loot-more" hidden></button>
              </div>
            </div>
            <!-- One of our windows has been over the Pickup Log for a while: said quietly, in the
                 lines' ink, so a dip in mesos an hour has its reason in sight. -->
            <p class="line" id="tracking-pickup-covered" hidden>Pickup Log covered: some mesos may be missed.</p>
          </div>
          <!-- The game's own EXP gauge, as its status bar draws it: the last reading. -->
          <div class="exp" id="tracking-exp" hidden>
            <!-- Beside the reading, the Character playing, as the game's Status Bar names them. -->
            <div class="exp-head">
              <p class="exp-figures"><b>EXP</b> <span id="exp-figures"></span></p>
              <p class="exp-character" id="exp-character" hidden></p>
            </div>
            <div class="exp-gauge" id="exp-gauge" role="progressbar" aria-label="EXP this level" aria-valuemin="0" aria-valuemax="100">
              <div class="exp-gauge-fill" id="exp-gauge-fill"></div>
              <!-- Where the bar was before a death, until it is past it again. -->
              <div class="exp-gauge-lost" id="exp-gauge-lost" hidden></div>
            </div>
            <!-- What lies ahead at the Last 5 min pace: a notch where the bar will be in so
                 long, as many as have room, and at the gauge's end, Time to Level. -->
            <div class="forecast" id="forecast" role="img" hidden></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
