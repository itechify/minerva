<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/owl-bubble.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owl Bubble</title>
    <script type="module" src="/src/owl-bubble.ts"></script>
  </head>
  <body class="hidden">
    <main class="owl-bubble" id="owl-bubble" data-mood="news">
      <img class="owl" src="/assets/owl-news.png" width="48" height="48" alt="" draggable="false" />
      <div class="panel bubble" id="bubble" role="status" aria-live="polite">
        <p class="note" id="line"></p>
        <ol class="choices" id="choices" hidden></ol>
        <button type="button" class="icon-button light dismiss" id="dismiss" aria-label="Hide this until Minerva starts again" title="Hide this until Minerva starts again" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </div>
    </main>
  </body>
</html>
