<html><head><meta charset="utf-8"><style>
@font-face{font-family:Maplestory;src:url("../fonts/Maplestory-Light.woff2");font-weight:100 500}

html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(rgba(178,194,232,.62),rgba(178,194,232,.62)),#fff;font-family:Maplestory,Arial,sans-serif;color:#1b2648}
