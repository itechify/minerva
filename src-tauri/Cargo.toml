[package]
name = "minerva"
version = "0.16.0"
description = "Minerva overlay shell: window lookup, Title Region capture and rendering around minerva-core"
authors = ["Jeffrey Davis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "minerva_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
minerva-core = { path = "../crates/minerva-core" }
tauri = { version = "2.12", features = ["tray-icon"] }
# RegisterHotKey on Windows: no keyboard hook, no input sent anywhere (ADR 0001).
tauri-plugin-global-shortcut = "2.4"
# Opens the shown map's MeowDB page in the player's browser.
tauri-plugin-opener = "2"
# A second launch exits and tells the running Minerva, which shows itself.
tauri-plugin-single-instance = "2"
# Checks the feed for a newer version (ADR 0019), driven from Rust only. SChannel TLS like
# reqwest's below: the default rustls backend needs NASM.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
# OSMS Data Explorer's files and pictures (ADR 0008), and MeowDB's search (ADR 0007).
# OS TLS (SChannel on Windows): reqwest's default rustls
# backend builds aws-lc, which needs NASM/CMake.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "gzip"] }
# The Leaderboard Key, made from the OS's random numbers.
getrandom = "0.3"

[dev-dependencies]
image = { workspace = true, features = ["png"] }
# Reads the trusted comment of an updater `.sig` (`probe update-manifest`): only the probe.
base64 = "0.22"

# The probe, its modes in a folder of their own; its `update-manifest` tests run with the
# app's (`cargo test -p minerva`).
[[example]]
name = "probe"
path = "examples/probe/main.rs"
test = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    # The Bug Report's Windows version and local time.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }
